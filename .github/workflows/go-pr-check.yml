name: Go Pull Request Check

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "packages/go/**"
      - ".github/workflows/go-pr-check.yml"

  pull_request:
    branches: [main]
    paths:
      - "packages/go/**"
      - ".github/workflows/go-pr-check.yml"

  workflow_dispatch:

concurrency:
  group: go-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checking-pr:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./packages/go/go.mod
          cache: true
          cache-dependency-path: ./packages/go/go.sum

      - name: Download dependencies
        working-directory: ./packages/go
        run: go mod download

      - name: Verify go.mod and go.sum are tidy
        working-directory: ./packages/go
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./packages/go)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        working-directory: ./packages/go
        run: go vet ./...

      - name: Run tests
        working-directory: ./packages/go
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build packages
        working-directory: ./packages/go
        run: go build ./...
